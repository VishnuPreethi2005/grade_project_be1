<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Manager - Module 2</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --text: #f1f5f9;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 400px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
            text-align: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: white;
            box-sizing: border-box;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        button {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not_allowed;
        }

        .btn-start {
            background: var(--success);
            color: white;
        }

        .btn-stop {
            background: var(--danger);
            color: white;
        }

        .status-box {
            margin-top: 2rem;
            padding: 1rem;
            background: #0f172a;
            border-radius: 0.5rem;
            text-align: center;
        }

        .status-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .status-not_created {
            background: #475569;
            color: white;
        }

        .status-running {
            background: var(--success);
            color: white;
        }

        .status-exited {
            background: var(--danger);
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🐳 Docker Manager</h1>
        <div class="form-group">
            <label>Project Name</label>
            <input type="text" id="projectName" value="test_project">
        </div>
        <div class="form-group">
            <label>Host Path (Absolute)</label>
            <input type="text" id="hostPath" placeholder="C:/my_projects/test">
        </div>

        <div class="actions">
            <button class="btn-start" onclick="operate('start')">START</button>
            <button class="btn-stop" onclick="operate('stop')">STOP</button>
        </div>

        <div class="status-box">
            <div style="font-size: 0.875rem; color: #94a3b8;">Current Status</div>
            <div id="statusTag" class="status-tag status-not_created">UNKNOWN</div>
            <div id="statusMsg" style="font-size: 0.75rem; margin-top: 0.5rem; color: #64748b;"></div>
        </div>
    </div>

    <script>
        async function updateStatus() {
            const project = document.getElementById('projectName').value;
            if (!project) return;
            try {
                const res = await fetch(`/module2/status/${project}`);
                const data = await res.json();
                const tag = document.getElementById('statusTag');
                tag.innerText = data.status;
                tag.className = 'status-tag status-' + data.status;
            } catch (e) { }
        }

        async function operate(action) {
            const project = document.getElementById('projectName').value;
            const path = document.getElementById('hostPath').value;
            const msg = document.getElementById('statusMsg');

            msg.innerText = "Requesting...";

            try {
                const res = await fetch(`/module2/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        project_name: project,
                        host_path: path
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.innerText = data.message || "Operation successful";
                    updateStatus();
                } else {
                    msg.innerHTML = `<span style="color:var(--danger)">${data.detail}</span>`;
                }
            } catch (e) {
                msg.innerHTML = `<span style="color:var(--danger)">Network error</span>`;
            }
        }

        setInterval(updateStatus, 3000);
        updateStatus();
    </script>
</body>

</html>
