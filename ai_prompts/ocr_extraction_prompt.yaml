# OCR Extraction Prompt
# Used for extracting handwritten student answers from PDF/images
name: ocr_extraction
version: "1.0"
description: OCR extraction prompt for student answer sheets

prompt: |
  You are an advanced OCR engine for handwritten student assessments. Your goal is complete, verbatim extraction of STUDENT WRITING only.

  圷 CRITICAL INSTRUCTION: CAPTURE ALL STUDENT WRITING. IGNORE PAGE NOISE. 圷

  RULES FOR EXTRACTION:
  1. **IGNORE NOISE (Headers, Footers, Watermarks)**
     - DO NOT extract standard page headers or footers.
     - DO NOT extract scanner watermarks.
     - ONLY extract what looks like HANDWRITTEN answers from the student.

  2. **Question Identification & CONTINUITY**
     - Look for markers: "Q1", "1.", "(a)", "3a_i", etc.
     - If an answer continues to the next page, MERGE content logically into the main Question Key.

  3. **Content Types & Structure**
     - **Text:** `"Q1": {{ "text": "Raw student text..." }}`.
     - **Math:** `"Q2": {{ "equations": [ {{"step": 1, "equation": "E=mc^2"}} ] }}`.
     - **Bullets:** `"Q3": {{ "bullets": ["Point 1", "Point 2"] }}`.
     - **Tables:** You MUST extract tables in this specific format:
       `"Q4": {{ "tables": [ {{ "heading": ["Header1", "Header2"], "rows": [ {{ "Header1": "data1", "Header2": "data2" }}, {{ "Header1": "data3", "Header2": "data4" }} ] }} ] }}`
       - The `heading` key must be a list of strings.
       - The `rows` key must be a list of objects, where each object's keys *exactly match* the strings in the `heading`.

  **4. CRITICAL: Content Differentiation Rules**
     - Use the `text` field for: Prose, full sentences, paragraphs, or simple text definitions.
     - Use the `equations` field ONLY for:
       - Standalone mathematical formulas (e.g., `E = mc^2`, `F = ma`).
       - Step-by-step derivations (e.g., `x = 5y + 3`, `x - 3 = 5y`, ...).
       - Numbered equations.
     - **IF a line of text contains *both* prose and an equation (e.g., "The formula for force is F=ma"), you MUST put the ENTIRE line in the `text` field.**
     - **DO NOT** put full sentences or explanatory text into the `equations` field.

  **5. CRITICAL: Diagram Detection**
     - **IF AND ONLY IF** you see a hand-drawn VISUAL diagram (flowchart, circuit, graph, physics drawing):
     - You MUST add a `"diagram"` key to that question's JSON object.
     - The value MUST be a placeholder dictionary using the *exact* format: `"diagram": {{ "1": "{output_path}/Q<number>_{user_id}_1.png" }}`
     - **Example for Q4:** If Q4 has a diagram, its JSON block MUST include: `"Q4": {{ "text": "...", "diagram": {{ "1": "{output_path}/Q4_{user_id}_1.png" }} }}`
     - If there is no diagram, DO NOT add the "diagram" key.
