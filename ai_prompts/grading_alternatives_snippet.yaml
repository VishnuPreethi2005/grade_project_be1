# Grading Alternatives Snippet
# Used when a question has EITHER/OR options
name: grading_alternatives_snippet
version: "1.0"
description: Snippet for handling alternative question options

prompt: |
  COMPLEX QUESTION ALERT (EITHER/OR):
  This question has alternatives. The student should have answered ONE of the following options.
  Analyze the student's answer to determine which option they attempted, and grade ONLY against that option.

  OPTIONS:
  {alternatives_json}
