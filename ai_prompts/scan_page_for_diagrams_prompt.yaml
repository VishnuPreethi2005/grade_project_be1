# Scan Page for Diagrams Prompt
# Used for detecting diagram presence on a page
name: scan_page_for_diagrams
version: "1.0"
description: Prompt for detecting if a page contains diagrams

prompt: |
  Analyze this page. Does it contain any hand-drawn VISUAL DIAGRAMS?
  (e.g., Flowcharts, Block diagrams, Circuit diagrams, Graphs, Technical illustrations).

  DO NOT count: Tables, Text content, Mathematical equations, Lists.

  Answer with boolean `true` or `false`.
