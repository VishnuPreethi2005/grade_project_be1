# Scan Page Details Prompt
# Used for extracting page metadata
name: scan_page_details
version: "1.0"
description: Prompt for scanning page number and diagram presence

prompt: |
  Analyze this image.
  1. Extract the page number (return 9999 if not found).
  2. Determine if it contains any hand-drawn VISUAL DIAGRAMS (true/false).

  Respond with a valid JSON object matching this schema:
  {
    "page_number": <integer>,
    "has_diagram": <boolean>
  }
