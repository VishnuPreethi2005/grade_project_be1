<!DOCTYPE html>
<html lang="en-us">
<head>
    <title>Textbox Input</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <label for="user_text">Enter Text:</label>
        <input type="text" id="user_text" name="user_text">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
